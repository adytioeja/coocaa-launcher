<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coocaa Smart TV Launcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body {
    width: 100vw; height: 100vh; overflow: hidden; color: #ffffff;
    background: radial-gradient(circle at 20% 20%, #1e3538 0%, #111c21 55%, #0a0f12 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px 52px;
  }
  .top-section { display: flex; justify-content: space-between; align-items: flex-start; gap: 36px; height: 66%; }
  
  /* Kiri: Jam, Cuaca/AQI, Jadwal Sholat */
  .left-panel { flex: 1; padding-top: 8px; }
  .greeting { font-size: 22px; color: #cbd5e1; margin-bottom: 4px; font-weight: 400; }
  .clock { font-size: 86px; font-weight: 300; line-height: 1; letter-spacing: -2px; margin-bottom: 10px; }
  .date-text { font-size: 20px; color: #e2e8f0; margin-bottom: 6px; }
  .aqi-text { font-size: 18px; margin-bottom: 26px; color: #94a3b8; }
  .aqi-badge { color: #fb923c; font-weight: 600; }

  .prayer-row { display: flex; gap: 26px; align-items: center; }
  .prayer-item { opacity: 0.72; transition: all 0.2s; }
  .prayer-item.active { opacity: 1; transform: scale(1.06); }
  .prayer-name { font-size: 14px; color: #cbd5e1; margin-bottom: 2px; }
  .prayer-time { font-size: 26px; font-weight: 400; }
  .prayer-item.active .prayer-time { font-weight: 700; color: #ffffff; }

  /* Kanan: Nav Pill & EPL Widget Lengkap */
  .right-panel { width: 510px; height: 100%; display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
  .nav-pills {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px);
    padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
  }
  .pill {
    padding: 7px 16px; border-radius: 999px; font-size: 14px; color: #e2e8f0;
    border: 2px solid transparent; transition: 0.15s;
  }
  .pill.active-tab { background: #ffffff; color: #0f172a; font-weight: 600; }
  .pill.focused { border-color: #38bdf8; transform: scale(1.05); }

  .epl-card {
    width: 100%; flex: 1; min-height: 0;
    background: rgba(15, 23, 42, 0.62); backdrop-filter: blur(16px);
    border: 2px solid rgba(255, 255, 255, 0.12); border-radius: 22px;
    padding: 16px 20px; display: flex; flex-direction: column;
    transition: border-color 0.2s;
  }
  .epl-card.focused-box { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.25); }

  .epl-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
  .epl-title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; color: #38bdf8; text-transform: uppercase; }
  .epl-tabs { display: flex; gap: 6px; }
  .epl-tab {
    font-size: 12px; padding: 4px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: #cbd5e1; border: 2px solid transparent;
  }
  .epl-tab.active { background: #0284c7; color: #ffffff; font-weight: 600; }
  .epl-tab.focused { border-color: #ffffff; }

  /* Area Scrollable Klasemen & Jadwal */
  .epl-scroll-area {
    flex: 1; overflow-y: auto; padding-right: 6px; scroll-behavior: smooth;
  }
  .epl-scroll-area::-webkit-scrollbar { width: 5px; }
  .epl-scroll-area::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 4px; }
  .epl-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }

  .epl-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .epl-table th {
    position: sticky; top: 0; background: #131d31; z-index: 2;
    text-align: left; color: #94a3b8; font-weight: 600; padding: 6px 4px; font-size: 11.5px;
  }
  .epl-table td { padding: 6px 4px; border-top: 1px solid rgba(255,255,255,0.06); }
  .epl-table td.num, .epl-table th.num { text-align: right; width: 34px; }
  .rank-badge {
    display: inline-block; width: 22px; text-align: center; border-radius: 5px;
    font-weight: 700; font-size: 12px; padding: 1px 0;
  }
  .ucl { background: rgba(14, 165, 233, 0.25); color: #38bdf8; }
  .uel { background: rgba(245, 158, 11, 0.25); color: #fbbf24; }
  .rel { background: rgba(239, 68, 68, 0.25); color: #f87171; }

  /* Daftar Jadwal per Gameweek */
  .gw-banner {
    font-size: 12px; font-weight: 700; color: #38bdf8; background: rgba(56,189,248,0.12);
    padding: 5px 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between;
  }
  .match-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px;
  }
  .match-teams { flex: 1; display: flex; justify-content: space-between; align-items: center; padding-right: 12px; }
  .team-name { width: 42%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team-home { text-align: right; font-weight: 600; }
  .team-away { text-align: left; font-weight: 600; }
  .match-score {
    background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px;
    font-weight: 700; font-size: 12px; min-width: 48px; text-align: center;
  }
  .match-time { font-size: 11.5px; color: #94a3b8; width: 88px; text-align: right; }

  /* Bawah: Nama Aplikasi & Dock */
  .bottom-section { width: 100%; }
  .focused-app-title { font-size: 34px; font-weight: 700; margin-bottom: 12px; min-height: 40px; }

    background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(16px);
